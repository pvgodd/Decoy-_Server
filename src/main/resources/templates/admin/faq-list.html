<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('FAQ 관리', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="toolbar">
        <h1 class="page-title" style="margin:0;">FAQ 관리</h1>
        <a class="btn spacer" th:href="@{/admin/faqs/new}">새 FAQ 작성</a>
    </div>
    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr><th class="center" style="width:100px;">분류</th><th>질문</th>
                <th class="center" style="width:70px;">순서</th><th class="center" style="width:160px;">관리</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(faqs)}"><td colspan="4" class="empty">등록된 FAQ가 없습니다.</td></tr>
            <tr th:each="f : ${faqs}">
                <td class="center"><span class="badge badge-gray" th:text="${f.category}"></span></td>
                <td th:text="${f.question}"></td>
                <td class="center muted" th:text="${f.sortOrder}"></td>
                <td class="center">
                    <a th:href="@{/admin/faqs/{id}/edit(id=${f.id})}" class="btn btn-sm btn-outline">수정</a>
                    <form th:action="@{/admin/faqs/{id}/delete(id=${f.id})}" method="post" class="inline-form"
                          data-confirm="삭제할까요?">
                        <button class="btn btn-sm btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
