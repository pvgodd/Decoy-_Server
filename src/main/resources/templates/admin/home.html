<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('관리자', ~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 class="page-title">관리자</h1>
    <p class="page-desc">회원 승인, 입점상담·핫라인 처리, 게시판 관리를 할 수 있습니다.</p>

    <div class="grid grid-3">
        <a th:href="@{/admin/members(status='PENDING')}" class="card stat" style="text-decoration:none;">
            <span class="num" th:text="${pendingMembers}">0</span>
            <span class="label">승인 대기 회원</span>
        </a>
        <a th:href="@{/admin/consults}" class="card stat" style="text-decoration:none;">
            <span class="num" th:text="${openConsults}">0</span>
            <span class="label">미완료 입점상담</span>
        </a>
        <a th:href="@{/admin/hotlines}" class="card stat" style="text-decoration:none;">
            <span class="num" th:text="${openHotlines}">0</span>
            <span class="label">미완료 핫라인</span>
        </a>
    </div>

    <div class="card mt-24">
        <h3 class="card-title">관리 메뉴</h3>
        <div class="grid grid-2">
            <a th:href="@{/admin/members}" class="btn btn-outline">회원 관리</a>
            <a th:href="@{/admin/consults}" class="btn btn-outline">입점상담 관리</a>
            <a th:href="@{/admin/hotlines}" class="btn btn-outline">핫라인 관리</a>
            <a th:href="@{/admin/notices}" class="btn btn-outline">공지사항 관리</a>
            <a th:href="@{/admin/faqs}" class="btn btn-outline">FAQ 관리</a>
        </div>
    </div>
</th:block>
</body>
</html>
