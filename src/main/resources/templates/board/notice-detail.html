<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${notice.title}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <div style="max-width: 760px; margin: 0 auto;">
        <div class="card">
            <h1 class="page-title" th:text="${notice.title}">제목</h1>
            <p class="muted" style="font-size:13px; border-bottom:1px solid var(--border); padding-bottom:14px;">
                <span th:text="${notice.author}">작성자</span> ·
                <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span> ·
                조회 <span th:text="${notice.viewCount}">0</span>
            </p>
            <div class="content-text mt-16" th:text="${notice.content}"></div>
        </div>
        <div class="form-actions"><a th:href="@{/notice/list}" class="btn btn-ghost">목록으로</a></div>
    </div>
</th:block>
</body>
</html>
