<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('대시보드', ~{::content})}">
<body>
<th:block th:fragment="content">
    <h1 class="page-title">
        <span th:text="${member.companyName}">회사명</span> 님, 환영합니다
    </h1>
    <p class="page-desc">협력사 전용 포털입니다. 아래에서 필요한 업무를 이용하세요.</p>

    <div class="grid grid-3">
        <a th:href="@{/consult/apply}" class="card" style="text-decoration:none;">
            <h3 class="card-title">입점상담 신청</h3>
            <p class="muted" style="margin:0;">신규 입점·제휴 상담을 신청합니다.</p>
        </a>
        <a th:href="@{/hotline/register}" class="card" style="text-decoration:none;">
            <h3 class="card-title">핫라인 제보</h3>
            <p class="muted" style="margin:0;">불공정·윤리 위반을 익명으로 제보합니다.</p>
        </a>
        <a th:href="@{/mypage}" class="card" style="text-decoration:none;">
            <h3 class="card-title">내 정보</h3>
            <p class="muted" style="margin:0;">담당자 정보 확인 및 비밀번호 변경.</p>
        </a>
    </div>

    <div class="card mt-24">
        <div class="toolbar" style="margin-bottom:12px;">
            <h2 class="section-title" style="margin:0;">공지사항</h2>
            <a class="spacer" th:href="@{/notice/list}">전체보기</a>
        </div>
        <div th:if="${#lists.isEmpty(notices)}" class="empty">등록된 공지사항이 없습니다.</div>
        <div class="table-wrap" th:unless="${#lists.isEmpty(notices)}">
            <table class="table">
                <tbody>
                <tr th:each="n : ${notices}">
                    <td style="width:60px;" class="center">
                        <span th:if="${n.pinned}" class="badge badge-blue">공지</span>
                    </td>
                    <td><a th:href="@{/notice/{id}(id=${n.id})}" th:text="${n.title}">제목</a></td>
                    <td style="width:120px;" class="center muted"
                        th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd')}">날짜</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>
</body>
</html>
