<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('접수 완료', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div style="max-width: 520px; margin: 32px auto 0;">
        <div class="card text-center">
            <h1 class="page-title" th:text="${title}">접수되었습니다</h1>
            <p class="page-desc" style="margin-top:12px;">
                아래 접수번호를 보관해 주세요. 접수 시 입력한 조회 비밀번호와 함께 처리 현황을 조회할 수 있습니다.
            </p>
            <div style="font-size:22px; font-weight:700; letter-spacing:1px; padding:16px; background:var(--primary-light); border-radius:8px; color:var(--primary-dark);"
                 th:text="${receiptNo}">접수번호</div>
            <div class="form-actions" style="justify-content:center;">
                <a th:href="${lookupUrl}" class="btn">처리현황 조회</a>
                <a th:href="@{/}" class="btn btn-ghost">처음으로</a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
