<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="|로그인 · ${app.brand}|">파트너 포털 로그인</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <span class="auth-badge">PARTNER PORTAL</span>
            <h1 class="auth-title" th:text="${app.brand}">파트너 포털</h1>
            <p class="auth-sub">협력사 전용 포털</p>
        </div>

        <div class="auth-box">
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info" th:text="${infoMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-row">
                    <label for="loginId">아이디</label>
                    <input type="text" id="loginId" name="loginId" class="input"
                           autocomplete="username" required autofocus>
                </div>
                <div class="form-row">
                    <label for="password">비밀번호</label>
                    <div class="pw-field">
                        <input type="password" id="password" name="password" class="input"
                               autocomplete="current-password" required>
                        <button type="button" class="pw-toggle" data-toggle="password" aria-label="비밀번호 표시">표시</button>
                    </div>
                </div>

                <div class="remember-row">
                    <label><input type="checkbox" name="remember-id" id="remember-id"> 아이디 저장</label>
                    <span class="auth-links">
                        <a th:href="@{/support/find-id}">아이디 찾기</a> /
                        <a th:href="@{/support/password}">비밀번호 초기화</a>
                    </span>
                </div>

                <button type="submit" class="btn btn-block btn-lg">로그인</button>
            </form>
        </div>

        <nav class="auth-foot">
            <a th:href="@{/faq}">FAQ(자주묻는 질문)</a>
            <a th:href="@{/member/join}">회원가입</a>
            <a th:href="@{/hotline/register}">핫라인 등록</a>
            <a th:href="@{/hotline/list}">핫라인 조회</a>
            <a th:href="@{/consult/apply}">입점상담신청</a>
            <a th:href="@{/consult/status}">상담현황 조회</a>
            <a th:href="@{/notice/list}">공지사항</a>
            <a th:href="@{/policy/privacy}">개인정보처리방침</a>
        </nav>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
