<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('가입 신청 완료', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div style="max-width: 520px; margin: 32px auto 0;">
        <div class="card text-center">
            <h1 class="page-title">가입 신청이 완료되었습니다</h1>
            <p class="page-desc" style="margin-top: 12px;">
                <strong th:text="${companyName}">회사명</strong> 담당자님, 가입 신청이 접수되었습니다.<br>
                관리자 승인이 완료되면 등록하신 이메일로 안내드립니다.
            </p>
            <div class="form-actions" style="justify-content: center;">
                <a th:href="@{/login}" class="btn btn-lg">로그인 화면으로</a>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
