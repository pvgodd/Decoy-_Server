<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('새 비밀번호 설정', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div style="max-width: 480px; margin: 0 auto;">
        <h1 class="page-title">새 비밀번호 설정</h1>
        <p class="page-desc">새로 사용할 비밀번호를 입력해 주세요.</p>

        <div class="card">
            <div th:if="${#fields.hasGlobalErrors('form')}" class="alert alert-error">
                <div th:each="err : ${#fields.globalErrors('form')}" th:text="${err}"></div>
            </div>
            <form th:action="@{/support/reset}" th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{token}">
                <div class="form-row">
                    <label for="password" class="required">새 비밀번호</label>
                    <div class="pw-field">
                        <input type="password" id="password" th:field="*{password}" class="input"
                               th:classappend="${#fields.hasErrors('password')} ? 'input-invalid'"
                               autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-toggle="password">표시</button>
                    </div>
                    <div class="hint">영문·숫자·특수문자 포함 8~64자</div>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-row">
                    <label for="passwordConfirm" class="required">비밀번호 확인</label>
                    <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" class="input"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'input-invalid'"
                           autocomplete="new-password">
                    <div class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
                </div>
                <button type="submit" class="btn btn-block btn-lg">비밀번호 변경</button>
            </form>
        </div>
    </div>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
