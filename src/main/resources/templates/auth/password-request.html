<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('비밀번호 초기화', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div style="max-width: 480px; margin: 0 auto;">
        <h1 class="page-title">비밀번호 초기화</h1>
        <p class="page-desc">아이디와 가입 이메일을 입력하면 초기화 링크를 메일로 보내드립니다.</p>

        <div class="card">
            <div th:if="${requested}" class="alert alert-success">
                입력하신 정보가 일치하면 초기화 링크를 메일로 보냈습니다. 메일함을 확인해 주세요.
                (링크는 30분간 유효합니다.)
            </div>
            <form th:unless="${requested}" th:action="@{/support/password}" th:object="${form}" method="post" novalidate>
                <div class="form-row">
                    <label for="loginId" class="required">아이디</label>
                    <input type="text" id="loginId" th:field="*{loginId}" class="input"
                           th:classappend="${#fields.hasErrors('loginId')} ? 'input-invalid'">
                    <div class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
                </div>
                <div class="form-row">
                    <label for="email" class="required">이메일</label>
                    <input type="email" id="email" th:field="*{email}" class="input"
                           th:classappend="${#fields.hasErrors('email')} ? 'input-invalid'">
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-block btn-lg">초기화 링크 받기</button>
            </form>
        </div>
        <p class="text-center mt-16"><a th:href="@{/login}">로그인 화면으로</a></p>
    </div>
</th:block>
</body>
</html>
